plugins:
  - rubocop-performance

require:
  - ./rubocop/cop/representer/empty_line_before_comment

AllCops:
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - "node_modules/**/*"
    - "vendor/**/*"
    - "grammars/**/*"
    - "test/fixtures/**/*"
    - "test/golden/**/*"

Bundler/OrderedGems:
  Enabled: false

# Declarations list one item per line, aligned with the first, and a call
# that spans several lines lines up its strings, such as a rewrite's `as:`.
Layout/ArgumentAlignment:
  Enabled: false

Layout/HashAlignment:
  EnforcedLastArgumentHashStyle: ignore_implicit

# In a language file, a string is always code and a symbol is always a node
# type, so lists are written out in full.
Style/SymbolArray:
  Exclude:
    - lib/representer/languages/*/**/*

Style/WordArray:
  Exclude:
    - lib/representer/languages/*/**/*

Layout/DotPosition:
  EnforcedStyle: trailing

Layout/EndOfLine:
  EnforcedStyle: lf

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/EmptyLinesAroundAccessModifier:
  EnforcedStyle: only_before

Layout/LineLength:
  Max: 135
  AutoCorrect: true

Metrics/BlockLength:
  Exclude:
    - "test/**/*"

Metrics/MethodLength:
  # We probably want to bring this down but let's start here for now
  Max: 20
  Exclude:
    - "test/**/*"

Naming/PredicatePrefix:
  Enabled: false

Style/ConditionalAssignment:
  EnforcedStyle: assign_inside_condition
  SingleLineConditionsOnly: false
  IncludeTernaryExpressions: false

Style/StringLiterals:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/DocumentationMethod:
  Enabled: false

Style/DoubleNegation:
  Enabled: false

Style/RedundantSelf:
  Enabled: false

Style/MultilineTernaryOperator:
  Enabled: false

Style/ZeroLengthPredicate:
  Enabled: false

Naming/VariableNumber:
  EnforcedStyle: snake_case

Style/LambdaCall:
  EnforcedStyle: braces

# Staged languages and the engine use the compact form
# (`module Representer::Engine`), and the languages still on the old
# structure use nested modules.
Style/ClassAndModuleChildren:
  Enabled: false

# A comment describes the code below it, so it needs a blank line above it
# (see rubocop/cop/representer/empty_line_before_comment.rb).
Representer/EmptyLineBeforeComment:
  Enabled: true
