# The tree-sitter grammars used by the representer, each pinned to one commit.
#
# bin/build-grammars fetches each grammar at its commit and compiles it into
# grammars/build/<name>.so (Linux) or grammars/build/<name>.dylib (macOS).
#
# Changing a commit can change the representation of any solution in that
# language, so bump the language's version in the same commit.
#
# Each entry has:
# - repo: the git repository.
# - commit: the full commit SHA to build.
# - src: the folder that holds parser.c, if it isn't "src".
# - generate: true if the repository doesn't commit parser.c, so that
#   bin/build-grammars runs `tree-sitter generate` first (this needs the
#   tree-sitter CLI and node).
# - symbol: the grammar's C name, if it isn't the entry's name.
#   tree-sitter exports the grammar as tree_sitter_<symbol>().

c_sharp:
  repo: https://github.com/tree-sitter/tree-sitter-c-sharp
  commit: 8c0abe0b84a3681d3e6852ce2e2a1eecb4f731c5

