  status: undecided
  note: "The solutions differ in the spaces between tokens or inside strings. The representations first differ at `[i, j] = value < array[mid] ? [i, mid-1] : [mid+1, j];` and `[i, j] = value < array[mid] ? [i, mid - 1] : [mid + 1, j];`."
