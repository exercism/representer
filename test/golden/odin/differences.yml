# How the groups that the representer makes today differ from the groups
# these solutions were in on production (groups.yml). test/golden_test.rb
# fails on any difference that isn't listed here, and on any listed
# difference that no longer happens. bin/regenerate-golden rewrites this
# file, and keeps each difference's status and note.
#
# - split: a production group whose solutions now get different
#   representations. The solutions are listed by their new group.
# - merge: solutions from different production groups that now get the
#   same representation. The solutions are listed by production group.
# - unrepresentable: a solution that now gets no representation.
# - near_miss_merge: a single that gets the same representation as its
#   variant, a copy with one small change to its code (see variant.yml).
#
# status is undecided until iHiD decides whether the difference is right
# (accepted) or a bug to fix (rejected), and why then says why.
- exercise: difference-of-squares
  kind: split
  solutions:
    - [rcmonnet, supermahars]
    - [frederickjeanguerin]
  status: undecided
  note: "The solutions differ in the spaces between tokens or inside strings. The representations first differ at `return n * (n + 1) * (2 * n + 1) / 6` and `return n * (n+1) * (2*n + 1) / 6`."
- exercise: leap
  kind: split
  solutions:
    - [fndlt, grab0id]
    - [rcmonnet]
  status: undecided
  note: "The solutions differ in the spaces between tokens or inside strings. The representations first differ at `return (year % 4 == 0) && ((year % 100 != 0) || (year % 400 == 0))` and `return (year%4==0) && ((year%100!=0) || (year%400==0))`."
- exercise: two-fer
  kind: split
  solutions:
    - [kari-1283, xoSauce]
    - [yaguet]
  status: undecided
  note: "The solutions differ in the spaces between tokens or inside strings. The representations first differ at `return fmt.tprintf(\"One for %s, one for me.\", name)` and `return fmt.tprintf(\"One for %s, one for me.\",name)`."
- exercise: gigasecond
  kind: near_miss_merge
  solutions:
    - [david82]
  status: accepted
  why: "The variant only changes an import, which the representer drops. That change would stop the variant compiling or passing its tests, so no real solution can look like it."
  note: "The variant gets the same representation. Changes the string `\"core:time/datetime\"` to `\"core:time/eatetime\"` on line 3 of gigasecond.odin."
