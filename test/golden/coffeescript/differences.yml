# How the groups that Rosetta makes today differ from the groups
# these solutions were in on production (groups.yml). test/golden_test.rb
# fails on any difference that isn't listed here, and on any listed
# difference that no longer happens. bin/regenerate-golden rewrites this
# file, and keeps each difference's status and note.
#
# - split: a production group whose solutions now get different
#   representations. The solutions are listed by their new group.
# - merge: solutions from different production groups that now get the
#   same representation. The solutions are listed by production group.
# - unrepresentable: a solution that now gets no representation.
# - near_miss_merge: a single that gets the same representation as its
#   variant, a copy with one small change to its code (see variant.yml).
#
# status is undecided until iHiD decides whether the difference is right
# (accepted) or a bug to fix (rejected), and why then says why.
- exercise: accumulate
  kind: merge
  solutions:
    - [Dipiert, alxndr, gellerby]
    - [danharper, plongz, yinonbentor]
    - [davethomas11, daveyarwood, pbevin]
    - [Jipos]
    - [ranmeus]
  status: accepted
  why: "The solutions differ only in names, `@` and `this`, a call without brackets (`f x` and `f(x)`), and a one-line function body (`-> f(x) for x in @`), which CoffeeScript's parser reads as a block of one statement."
  note: "The code first differs at `Array::accumulate = (accumulator) ->` and `Array::accumulate = (fn) -> fn(x) for x in @`."
- exercise: series
  kind: merge
  solutions:
    - [Jaspash75]
    - [glennj]
  status: accepted
  why: "CoffeeScript's parser reads `x if c` as `if c then x`, `throw new Error 'm'` as `throw new Error('m')`, and a loop after its body (`(x for i in r)`) as the loop with the body inside it. The brackets around the loop only group."
  note: "The code first differs at `if series.length == 0` and `throw new Error 'series cannot be empty' if series.length == 0`."
- exercise: two-fer
  kind: merge
  solutions:
    - [4t2, Jaspash75, safwansamsudeen]
    - [KellenWatt, ladokp, rebelwarrior]
  status: accepted
  why: "The solutions differ only in quote style and a one-line function body, which CoffeeScript's parser reads as a block of one statement."
  note: "The code first differs at `@twoFer: (name = 'you') -> \"One for #{name}, one for me.\"` and `@twoFer: (name = \"you\") ->`."
