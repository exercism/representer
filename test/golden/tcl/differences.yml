    - [SHADOWDARK, vitalije, wataya]
    - [frerich, rkallos, steve-perkins]
    - [johnsyweb, rprimus, taishi132]
  status: accepted
  why: "The code only differs in spellings that mean the same (quote style, `${name}` and `$name`, and a `;` before a line break), and both solutions pass the tests."
  note: "The code first differs at `proc two-fer {{name you}} {` and `proc two-fer {{name \"you\"}} {`."
