# How the groups that Inspector makes today differ from the groups
# these solutions were in on production (groups.yml). test/golden_test.rb
# fails on any difference that isn't listed here, and on any listed
# difference that no longer happens. bin/regenerate-golden rewrites this
# file, and keeps each difference's status and note.
#
# - split: a production group whose solutions now get different
#   representations. The solutions are listed by their new group.
# - merge: solutions from different production groups that now get the
#   same representation. The solutions are listed by production group.
# - unrepresentable: a solution that now gets no representation.
# - near_miss_merge: a single that gets the same representation as its
#   variant, a copy with one small change to its code (see variant.yml).
#
# status is undecided until iHiD decides whether the difference is right
# (accepted) or a bug to fix (rejected), and why then says why.
- exercise: accumulate
  kind: merge
  solutions:
    - [Jokinen, anuragsoni, stsolak]
    - [anicolaspp, jadermcs, negative]
  status: accepted
  why: "The code only differs in names that the solution chose, which a mentor would comment on the same way."
  note: "The solutions differ only in whitespace and the names of the pattern's variables (`x :: xs` and `h :: t`)."
- exercise: leap
  kind: merge
  solutions:
    - [PEJaffe, pcabfer, skoldyrin]
    - [aristide, bkmurchison, jacobrvh]
  status: accepted
  why: "The code only differs in formatting and spellings that mean the same (brackets that only group), and both solutions pass the tests."
  note: "The solutions differ in line breaks and in brackets that only group: `(year % 4 == 0 && year % 100 != 0) || year % 400 == 0` and the same without the brackets. `&&` binds tighter than `||`, so both mean the same."
- exercise: reverse-string
  kind: merge
  solutions:
    - [2f1cafc, menrric, stevebosman]
    - [azenkwed, rabestro, sleat]
  status: accepted
  why: "Scala's parser reads an object body in braces and one opened by `:` with indentation as the same."
  note: "The solutions differ only in how the object's body is opened: braces in one, and Scala 3's `:` with indentation in the other. Scala's parser gives both the same tree."
- exercise: space-age
  kind: merge
  solutions:
    - [gilesrapkin, srmarjani, teten777]
    - [potapkin-pavel, samofcorinth, truecrunchyfrog]
  status: accepted
  why: "The code only differs in spellings that mean the same (how a number is written), and both solutions pass the tests."
  note: "The solutions differ only in a number's digit separators: `31557600` and `31_557_600` are the same number."
- exercise: two-fer
  kind: merge
  solutions:
    - [Barozzi, rajeshpg, ywang412]
    - [mkantor, mo3000, suic86]
    - [JohnMToal]
  status: accepted
  why: "Scala's parser reads `${name}` in an interpolated string as `$name`."
  note: "The solutions differ in a comment, and in `s\"One for $name, one for me.\"` and `s\"One for ${name}, one for me.\"`. The braces only mark where the interpolated expression ends."
- exercise: two-fer
  kind: merge
  solutions:
    - [Khrotan, javierpedreira, jgoday]
    - [MrunmayeeSabnis, cjvolkert, tkrueger]
  status: accepted
  why: "Scala's parser reads `${name}` in an interpolated string as `$name`."
  note: "The solutions differ in whitespace and line breaks, and in `$name` and `${name}` inside an interpolated string. The braces only mark where the interpolated expression ends."
