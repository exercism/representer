# How the groups that Rosetta makes today differ from the groups
# these solutions were in on production (groups.yml). test/golden_test.rb
# fails on any difference that isn't listed here, and on any listed
# difference that no longer happens. bin/regenerate-golden rewrites this
# file, and keeps each difference's status and note.
#
# - split: a production group whose solutions now get different
#   representations. The solutions are listed by their new group.
# - merge: solutions from different production groups that now get the
#   same representation. The solutions are listed by production group.
# - unrepresentable: a solution that now gets no representation.
# - near_miss_merge: a single that gets the same representation as its
#   variant, a copy with one small change to its code (see variant.yml).
#
# status is undecided until iHiD decides whether the difference is right
# (accepted) or a bug to fix (rejected), and why then says why.
- exercise: minesweeper
  kind: merge
  solutions:
    - [Cool-Katt, kenwilcox, nmortier12]
    - [sleepnova]
  status: accepted
  why: "The code is the same apart from comments and formatting, which Rosetta drops."
  note: "The code first differs at the end and `Tested on: 2022-07-28 00:13`."
- exercise: two-fer
  kind: merge
  solutions:
    - [enix93, fxtewolde123, tony-sappe]
    - [lopezca]
  status: accepted
  why: "The code differs only in the name of a parameter (`aName` and `aString`) and in a `.` after the last statement, which Pharo's parser reads the same as no `.`."
  note: "The code first differs at `^ 'One for you, one for me.'.` and `^ 'One for you, one for me.'`."
