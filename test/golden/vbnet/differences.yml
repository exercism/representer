  why: "The code only differs in comments and the case of a keyword, which VB.NET's parser ignores, so `as` and `As` are the same."
  note: "The code first differs at `' In order to get the tests running, first you need to make sure the Speak me...` and `Public Function Speak(Optional name as String = \"you\") As String`."
- exercise: two-fer
