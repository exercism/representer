- exercise: raindrops
  kind: merge
  solutions:
    - [AbianSL, mrk-vi, steffengodskesen]
    - [bolandi, datager, pixelgrid]
  status: accepted
  why: "AWK's parser reads braces around a single statement as no braces."
  note: "The code first differs at `result = \"\"` and `result=\"\"`. The two differ in layout and in braces around the single statement of each `if`, which AWK's parser reads as the same."
- exercise: reverse-string
  kind: split
  solutions:
    - [bokoyonomo]
    - [osebelin]
    - [tkentrich]
  status: undecided
  note: "The solutions differ in line breaks. The representations first differ at `{` and `{ for ( i = length ; i != 0 ; i -- ) x = x substr ( $0 , i , 1 );}`. The grammar can't parse a rule that starts on the same line as the `}` before it (`} END {print x}`), so bokoyonomo and tkentrich get Basic's representation, and osebelin gets the tree's."
