# How the groups that Inspector makes today differ from the groups
# these solutions were in on production (groups.yml). test/golden_test.rb
# fails on any difference that isn't listed here, and on any listed
# difference that no longer happens. bin/regenerate-golden rewrites this
# file, and keeps each difference's status and note.
#
# - split: a production group whose solutions now get different
#   representations. The solutions are listed by their new group.
# - merge: solutions from different production groups that now get the
#   same representation. The solutions are listed by production group.
# - unrepresentable: a solution that now gets no representation.
# - near_miss_merge: a single that gets the same representation as its
#   variant, a copy with one small change to its code (see variant.yml).
#
# status is undecided until iHiD decides whether the difference is right
# (accepted) or a bug to fix (rejected), and why then says why.
- exercise: lasagna
  kind: merge
  solutions:
    - [Antisthenes, asheinz, jkbys]
    - [LeeringFish, Scarboroid, pianocomposer321]
    - [MVale, mifuyne, pedrogouveia]
  status: accepted
  why: "The code is the same apart from comments and formatting, which Inspector drops."
  note: "The code first differs at `return \"Ding!\"` and `return \"Ding!\";`. The solutions only differ in spaces and in the `;` after the last statement of a block."
- exercise: lasagna
  kind: merge
  solutions:
    - [OscarMitchell, anseok, okcleary]
    - [dominictassio, jedikni, patolucatis]
    - [jimmytty, jr-sweig, mckzm]
  status: accepted
  why: "Perl's parser reads a `;` after the last statement of a block as no `;`, and `'Ding!'` as `\"Ding!\"`."
  note: "The code first differs at `return $ExpectedMinutesInOven - $actual_minutes_in_oven` and `return $ExpectedMinutesInOven - $actual_minutes_in_oven;`. The solutions differ in spaces, in the `;` after the last statement of a block, and in quotes: the third group returns `'Ding!'` and the others `\"Ding!\"`, which Perl's parser reads as the same string."
- exercise: hamming
  kind: near_miss_merge
  solutions:
    - [glennj]
  status: accepted
  why: "The variant only changes an import, which Inspector drops. That change would stop the variant compiling or passing its tests, so no real solution can look like it."
  note: "The variant gets the same representation. Changes the string `qw/ hamming_distance /` to `qw/ hamminh_distance /` on line 12 of lib/Hamming.pm."
