name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Cache compiled grammars
        id: grammars-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: grammars/build
          key: grammars-${{ runner.os }}-${{ hashFiles('grammars.yml', 'bin/build-grammars') }}

      # Some grammars (marked `generate: true` in grammars.yml) don't commit
      # their parser.c, so building them needs the tree-sitter CLI (node is
      # already on the runner).
      - name: Install the tree-sitter CLI
        if: steps.grammars-cache.outputs.cache-hit != 'true'
        run: npm install -g tree-sitter-cli@0.25.10

      - name: Build grammars
        run: bin/build-grammars

      - name: Run tests
        run: bin/run-tests.sh

  test-docker:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          install: true

      - name: Build Docker image and store in cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          load: true
          tags: exercism/inspector
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check that YJIT is enabled in the image
        run: |
          docker run --rm --entrypoint ruby exercism/inspector \
            -e 'abort "YJIT is not enabled" unless RubyVM::YJIT.enabled?'

      - name: Run tests in Docker
        run: SKIP_BUILD=1 bin/run-tests-in-docker.sh
